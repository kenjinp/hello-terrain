name: Deploy to Development

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9.5.0"

jobs:
  build-and-deploy-dev:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm -r --filter './packages/**' build

      - name: Build docs
        run: |
          cd apps/docs
          pnpm build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Install infrastructure dependencies
        working-directory: infrastructure
        run: pnpm install --frozen-lockfile

      - name: Deploy infrastructure and assets (dev)
        uses: pulumi/actions@v6
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        with:
          command: up
          stack-name: hello-terrain-infrastructure/dev
          work-dir: infrastructure
          config-map: |
            aws:region=us-east-1
            domain=${{ secrets.DOMAIN || 'hello-terrain.kenny.wtf' }}
            environment=dev
            route53:domainName=${{ secrets.DOMAIN_NAME || 'hello-terrain.kenny.wtf' }}

      - name: Deploy status (dev)
        run: |
          echo "✅ Development deployment completed successfully!"
          echo "🌐 Main site: https://hello-terrain.kenny.wtf"
          echo "🎮 Examples: https://hello-terrain.kenny.wtf/examples"
          echo "⚠️  This is a development deployment"
