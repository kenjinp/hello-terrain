name: Deploy PR Preview

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "10.27.0"

jobs:
  deploy-preview:
    if: >-
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/deploy')
    runs-on: ubuntu-latest

    steps:
      - name: Get PR head ref
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_DATA="$(gh api repos/${{ github.repository }}/pulls/${{ github.event.issue.number }})"
          echo "ref=$(echo "$PR_DATA" | jq -r '.head.ref')" >> "$GITHUB_OUTPUT"
          echo "sha=$(echo "$PR_DATA" | jq -r '.head.sha')" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm -r --filter './packages/**' build

      - name: Build docs
        env:
          NEXT_PUBLIC_SITE_URL: https://dev.hello-terrain.kenny.wtf
        run: |
          cd apps/docs
          pnpm build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Install infrastructure dependencies
        working-directory: infrastructure
        run: pnpm install --frozen-lockfile

      - name: Deploy infrastructure and assets (dev)
        uses: pulumi/actions@v6
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
        with:
          command: up
          stack-name: kenjinp/hello-terrain-infrastructure/dev
          work-dir: infrastructure/docs
          config-map: |
            aws:region=us-east-1
            domain=dev.hello-terrain.kenny.wtf
            environment=dev
            route53:domainName=dev.hello-terrain.kenny.wtf

      - name: Deploy status (dev)
        run: |
          echo "Development preview deployment completed successfully."
          echo "Preview site: https://dev.hello-terrain.kenny.wtf"
          echo "Examples: https://dev.hello-terrain.kenny.wtf/examples"

      - name: Comment preview URL
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${{ github.event.issue.number }}" --body "Preview deployed to https://dev.hello-terrain.kenny.wtf"
